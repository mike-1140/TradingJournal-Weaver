name: Tests

on:
  push:
    branches: [master, entwicklung]
  pull_request:

jobs:
  pytest:
    # Ablageordner und Pfade sind plattformneutral (src/utils/data_dirs.py) - auf allen drei
    # Systemen pruefen. fail-fast aus, damit ein Fehler auf einem System die anderen nicht abbricht.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tests ausfuehren
        run: pytest tests/ -v
